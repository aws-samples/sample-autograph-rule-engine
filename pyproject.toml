[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autograph-rule-engine"
version = "0.1.0"
description = "Graph-based rule management system with auto-discovered dependencies"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "gremlinpython>=3.6.0",
    "pydantic>=2.0",
    "simpleeval>=1.0",
    "boto3>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "graphviz>=0.20",
    "matplotlib>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autograph_rule_engine = ["py.typed"]
